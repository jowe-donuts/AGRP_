[pytest]
# pytest configuration for Ay, Gamit Ko 'To! Backend

# Minimum Python version
minversion = 7.0

# Test discovery patterns
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Output options
addopts = 
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    -ra

# Markers for organizing tests
markers =
    auth: Authentication and authorization tests
    items: Item management tests
    claims: Claims workflow tests
    integration: Integration tests
    unit: Unit tests

# Test paths
testpaths = tests

# Coverage options (optional, for pytest-cov)
# --cov=app --cov-report=html --cov-report=term-missing
